<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Ticket Bot</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🎫</div>
    <h1>Dashboard</h1>
    <p class="sub">__SUB_TEXT__</p>
    <div class="auth-error" id="error"></div>

    __SLUG_FORM__
    __DISCORD_BTN__
  </div>
</div>
<script>
const errorBox = document.getElementById('error');
const params = new URLSearchParams(window.location.search);
const err = params.get('error');
if (err) {
  errorBox.textContent = err;
  errorBox.classList.add('show');
}

const slugForm = document.getElementById('slug-form');
if (slugForm) {
  slugForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const value = document.getElementById('slug-input').value.trim();
    if (!value) return;
    window.location.href = '/login/' + encodeURIComponent(value);
  });
}
</script>
</body>
</html>
