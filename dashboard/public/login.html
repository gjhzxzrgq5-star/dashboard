<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Ticket Bot</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🎫</div>
    <h1>Dashboard</h1>
    <p class="sub">Connecte-toi avec le compte Discord autorisé pour gérer ton bot de tickets.</p>
    <div class="auth-error" id="error"></div>
    <a href="/api/auth/discord" class="btn-discord">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3c-.211.375-.457.881-.626 1.283a18.27 18.27 0 0 0-5.865 0C9.898 3.881 9.646 3.375 9.434 3a19.736 19.736 0 0 0-3.762 1.37C2.913 7.99 2.157 11.53 2.42 15.02a19.9 19.9 0 0 0 6.031 3.049c.486-.657.918-1.354 1.29-2.087a12.9 12.9 0 0 1-2.032-.98c.171-.124.338-.253.5-.386a14.16 14.16 0 0 0 12.062 0c.164.133.331.262.5.386-.646.383-1.325.71-2.033.98.372.734.804 1.43 1.29 2.087a19.86 19.86 0 0 0 6.033-3.05c.309-4.06-.548-7.567-2.744-11.65ZM9.5 13.14c-1.08 0-1.96-1.005-1.96-2.24s.862-2.24 1.96-2.24 1.982 1.014 1.963 2.24c0 1.235-.865 2.24-1.963 2.24Zm7.02 0c-1.08 0-1.96-1.005-1.96-2.24s.862-2.24 1.96-2.24 1.982 1.014 1.963 2.24c0 1.235-.865 2.24-1.963 2.24Z"/></svg>
      Se connecter avec Discord
    </a>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const err = params.get('error');
if (err) {
  const box = document.getElementById('error');
  box.textContent = err;
  box.classList.add('show');
}
</script>
</body>
</html>
